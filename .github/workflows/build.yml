name: Build Mod

on:
  push:
    branches: [master, "trae/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datagen:
    name: Datagen consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate data and assert no diff
        run: |
          ./gradlew runDatagen --console=plain
          git diff --exit-code -- src/main/generated/assets src/main/generated/data

  build:
    name: Build & upload jar
    needs: datagen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: hotsteel-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: hotsteel-sources
          path: build/libs/*-sources.jar

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: hotsteel-jars
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
